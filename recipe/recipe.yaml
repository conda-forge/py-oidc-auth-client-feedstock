schema_version: 1

context:
  version: "2611.0.0"
  build_number: "0"

package:
  name: py-oidc-auth-client
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/py-oidc-auth-client/py_oidc_auth_client-${{ version }}.tar.gz
  sha256: e8849e6cc309a4778df202cc7b8e72f54bb37dde0cad3b7d6983e740663cc696

build:
  number: ${{ build_number }}
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv
  python:
    entry_points:
      - oidc-auth = py_oidc_auth_client.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core
    - pip
  run:
    - python >=${{ python_min }}
    - httpx
    - platformdirs
    - rich
    - typing-extensions

tests:
  - python:
      imports:
        - py_oidc_auth_client
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Client library for the OIDC Auth server.
  description: |
    py-oidc-auth-client is the counterpart of the server-side library **py-oidc-auth**.

    While **py-oidc-auth** helps you add OpenID Connect login, token, and device endpoints to web frameworks,
    **py-oidc-auth-client** consumes those routes and gives you ready-to-use bearer tokens for calling protected APIs.
  documentation: https://py-oidc-auth-client.readthedocs.io
  homepage: https://github.com/freva-org/py-oidc-auth-client
  license: BSD-3-Clause
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - antarcticrainforest
